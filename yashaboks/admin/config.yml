# ============================================================
# yashaboks — конфиг панели управления (Sveltia CMS)
# ============================================================

backend:
  name: github
  repo: yashaboks/zoloto
  branch: main
  base_url: https://sveltia-cms-auth.crushingex8.workers.dev

# Куда панель кладёт загруженные фотографии.
# Сайт опубликован из подпапки yashaboks/, поэтому физически файлы
# должны лежать в yashaboks/assets/img, а на сайте они доступны по /assets/img.
media_folder: "yashaboks/assets/img"
public_folder: "/assets/img"

# Язык самой панели
locale: "ru"

# Автосжатие фотографий прямо в панели, ещё до отправки на сайт.
# Что бы ни загрузили — телефонный оригинал на 5 МБ или что угодно —
# панель сама уменьшит до 1600 px по длинной стороне и переведёт в WebP.
# Итог: примерно 200-400 КБ вместо 3-5 МБ.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 1600
        height: 1600

# Публикуем сразу, без черновиков-модерации
publish_mode: simple

collections:
  # ---------------- ИЗДЕЛИЯ ----------------
  # Каждый раздел каталога — отдельный файл. Раздел изделия задаётся тем,
  # в каком разделе оно лежит; отдельного выпадающего списка «Раздел» нет.
  #
  # Так сделано не для красоты: панель держит в памяти весь открытый список
  # целиком, и цена одного удаления растёт примерно как квадрат длины списка.
  # На 90 позициях одно удаление стоило ~32 МБ, на 21 позиции — ~1 МБ.
  # Из-за этого телефон и выбрасывал панель. Короткие списки лечат причину.
  #
  # У каждого списка items стоит required: false. Без него панель не даёт
  # удалить последнее изделие («поле должно быть заполнено») и раздел
  # невозможно опустошить. А опустошать надо: монеты и часы кончаются
  # и появляются снова. Пустой раздел сайту не мешает — кнопка фильтра
  # рисуется только при count > 0, см. renderFilters в assets/js/app.js.
  - name: "catalog"
    label: "Изделия в наличии"
    label_singular: "изделие"
    delete: false
    files:
      - name: "rings"
        label: "Каблучки — кольца, обручки, печатки"
        file: "yashaboks/assets/data/catalog/rings.json"
        format: "json"
        description: >-
          Раздел «Каблучки». Добавляйте, редактируйте и удаляйте изделия.
          Порядок меняется перетаскиванием. Фото не обязательно.
        fields:
          - name: "items"
            label: "Каблучки"
            label_singular: "изделие"
            widget: "list"
            required: false
            summary: "{{fields.name_uk}} · {{fields.weight}} г"
            # Список открывается свёрнутым целиком (minimize_collapsed),
            # а каждое изделие — одной строкой (collapsed).
            # Новое изделие добавляется наверх, чтобы не листать до конца.
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            fields:
              - name: "photos"
                label: "Фото (до 3-х; первое — обложка)"
                widget: "list"
                required: false
                max: 3
                field: { name: "image", label: "Фото", widget: "image" }
                hint: "Первое фото — обложка карточки. Можно 1, 2 или 3. Перетаскиванием меняется порядок."
              - { name: "name_uk", label: "Название", widget: "string" }
              - name: "proba"
                label: "Проба (585, 750, 999…)"
                widget: "number"
                value_type: "int"
                default: 585
              - name: "weight"
                label: "Вес, грамм (можно с запятой: 13,33)"
                widget: "string"
                hint: "Например: 13,33 или 13.33"
              - name: "length"
                label: "Длина (необязательно, напр. 50 см)"
                widget: "string"
                required: false
                hint: "Только для цепочек и браслетов. Можно оставить пустым."
              - name: "price"
                label: "Цена, ₴ (оставить пустым = «по договорённости»)"
                widget: "number"
                value_type: "int"
                required: false
              - name: "status"
                label: "Статус"
                widget: "select"
                default: "available"
                options:
                  - { label: "В наличии", value: "available" }
                  - { label: "Продано", value: "sold" }

